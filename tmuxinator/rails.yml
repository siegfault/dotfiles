# ~/.tmuxinator/NAME.yml

name: NAME
root: ~/code/NAME

windows:
  - rails:
      layout: tiled
      panes:
        - PORT=UNIQUE_PORT_NUMBER bin/dev
        - bundle exec rails c
        - tail -f log/development.log
        - bundle exec rails db
  - vim:
      layout: 565a,209x69,0,0{150x69,0,0,1,58x69,151,0,6}
      panes:
        - vim
        -
  - terminal:
